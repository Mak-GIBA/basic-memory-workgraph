<svg xmlns="http://www.w3.org/2000/svg" width="860" height="782" viewBox="0 0 860 782" role="img" aria-labelledby="title desc">
<title id="title">既存法と提案法の違い</title>
<desc id="desc">左の既存法は候補取得から元の内積で順位付けする。右の提案法は同じ候補取得の後に密度補正して順位付けする。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#333"/></marker></defs>
<rect width="860" height="782" fill="white"/>
<g font-family="Noto Sans CJK JP, Meiryo, sans-serif" fill="#161616">
<text x="430.0" y="35" text-anchor="middle" font-size="20" font-weight="bold">既存法と提案法の違い</text>
<text x="430.0" y="75" text-anchor="middle" font-size="13">概念図：実線は処理の流れ、破線はフィードバック。性能の実測図ではありません。</text>
<path d="M240.0,194 V257.0 H240.0 V316" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="209.0" y="227.0" width="62.0" height="20" fill="white"/>
<text x="240.0" y="240.0" font-size="12" text-anchor="middle">元スコア</text>
<path d="M620.0,194 V257.0 H620.0 V316" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="589.0" y="227.0" width="62.0" height="20" fill="white"/>
<text x="620.0" y="240.0" font-size="12" text-anchor="middle">元スコア</text>
<path d="M240.0,415 V478.0 H240.0 V537" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="222.0" y="448.0" width="36.0" height="20" fill="white"/>
<text x="240.0" y="461.0" font-size="12" text-anchor="middle">順位</text>
<path d="M620.0,415 V478.0 H620.0 V537" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="576.0" y="448.0" width="88.0" height="20" fill="white"/>
<text x="620.0" y="461.0" font-size="12" text-anchor="middle">補正後の順位</text>
<rect x="85.0" y="99" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.1"/>
<text x="99.0" y="121" font-size="12">既存法・維持　M1</text>
<text x="99.0" y="146" font-size="17" font-weight="bold">共通の候補取得</text>
<text x="99.0" y="170" font-size="13">同じ特徴量・索引・L</text>
<rect x="465.0" y="99" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.1"/>
<text x="479.0" y="121" font-size="12">提案法・維持　M1</text>
<text x="479.0" y="146" font-size="17" font-weight="bold">共通の候補取得</text>
<text x="479.0" y="170" font-size="13">同じ特徴量・索引・L</text>
<rect x="85.0" y="320" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.1"/>
<text x="99.0" y="342" font-size="12">既存法・維持　B2</text>
<text x="99.0" y="367" font-size="17" font-weight="bold">内積をそのまま使用</text>
<text x="99.0" y="391" font-size="13">元のスコアで順位決定</text>
<rect x="465.0" y="320" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="2.4"/>
<text x="479.0" y="342" font-size="12">提案法・変更　M3</text>
<text x="479.0" y="367" font-size="17" font-weight="bold">密度でスコア補正</text>
<text x="479.0" y="391" font-size="13">rho_iを事前計算して使用</text>
<rect x="85.0" y="541" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.1"/>
<text x="99.0" y="563" font-size="12">既存法・維持　B3</text>
<text x="99.0" y="588" font-size="17" font-weight="bold">上位K件</text>
<text x="99.0" y="612" font-size="13">同じ評価手順</text>
<rect x="465.0" y="541" width="310" height="95" rx="7" fill="#f6f6f6" stroke="#333" stroke-width="1.1"/>
<text x="479.0" y="563" font-size="12">提案法・維持　P3</text>
<text x="479.0" y="588" font-size="17" font-weight="bold">上位K件</text>
<text x="479.0" y="612" font-size="13">同じ評価手順</text>
</g>
</svg>